<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadro de Honor Escolar</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .name-text {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.15;
            word-break: break-word;
        }
        .toast {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            background: #1e293b; color: white; padding: 10px 16px; border-radius: 8px;
            font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            opacity: 0; transform: translateY(10px); transition: all .25s;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #b91c1c; }
        .cell-busy::after {
            content: ""; position: absolute; inset: 0; background: rgba(255,255,255,0.6);
            backdrop-filter: blur(2px); pointer-events: none; z-index: 5;
        }
        .cell-busy::before {
            content: ""; position: absolute; top: 50%; left: 50%; width: 32px; height: 32px;
            margin: -16px 0 0 -16px; border: 3px solid #cbd5e1; border-top-color: #2563eb;
            border-radius: 50%; animation: spin 0.8s linear infinite; z-index: 6;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s;
        }
        .modal-backdrop.show { opacity: 1; pointer-events: auto; }
        .admin-only.hidden-visitor { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">

        <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 text-center relative">
            <div class="absolute top-4 right-4 flex items-center gap-3 text-sm">
                <span id="auth-status" class="text-slate-500"></span>
                <button id="btn-login" class="flex items-center gap-2 px-3 py-1.5 rounded-lg font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 transition-all">
                    <i class="ph ph-sign-in"></i> Ingresar
                </button>
                <button id="btn-logout" class="flex items-center gap-2 px-3 py-1.5 rounded-lg font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 transition-all hidden">
                    <i class="ph ph-sign-out"></i> Cerrar sesión
                </button>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Cuadro de Honor Escolar</h1>
            <p id="header-subtitle" class="text-slate-500 mb-6">Cuadro de honor por curso.</p>

            <div id="course-selector" class="flex flex-wrap justify-center gap-2"></div>

            <div id="admin-actions" class="admin-only mt-6 flex flex-wrap justify-center gap-3">
                <input type="file" id="excel-input" accept=".xlsx, .xls, .csv" class="hidden" />
                <button id="btn-excel" class="flex items-center gap-2 px-5 py-3 rounded-lg font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 shadow-sm transition-all">
                    <i class="ph ph-file-text text-xl"></i>
                    Adjuntar Excel (<span id="excel-curso-label">1A</span>)
                </button>
                <button id="btn-add-cell" class="flex items-center gap-2 px-5 py-3 rounded-lg font-bold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 shadow-sm transition-all">
                    <i class="ph ph-plus-square text-xl"></i>
                    Agregar Cuadro
                </button>
                <button id="btn-remove-cell" class="flex items-center gap-2 px-5 py-3 rounded-lg font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 border border-slate-200 shadow-sm transition-all hidden">
                    <i class="ph ph-minus-square text-xl"></i>
                    Quitar último
                </button>
            </div>
        </header>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 overflow-x-auto no-scrollbar relative">
            <div id="grid-loading" class="absolute inset-0 flex items-center justify-center bg-white/80 z-10 hidden">
                <div class="flex items-center gap-3 text-slate-600">
                    <i class="ph ph-spinner animate-spin text-2xl"></i>
                    <span>Cargando curso…</span>
                </div>
            </div>
            <div class="min-w-[800px]">
                <div id="grid-container" class="grid grid-cols-7 gap-3"></div>
            </div>
            <div class="text-center text-xs text-slate-400 mt-4">
                <span id="size-label">49</span> cuadros · curso <span id="size-curso-label">1A</span>
            </div>
        </div>

        <div id="download-wrapper" class="admin-only flex justify-center pt-2 pb-8">
            <button id="btn-download" class="flex items-center gap-2 px-8 py-4 rounded-xl font-bold text-lg text-white shadow-lg transition-all bg-blue-600 hover:bg-blue-700 hover:shadow-xl hover:-translate-y-1">
                <i class="ph ph-download-simple text-2xl" id="download-icon"></i>
                <i class="ph ph-spinner animate-spin text-2xl hidden" id="loading-icon"></i>
                <span id="download-text">Descargar Cuadro Completo (1A)</span>
            </button>
        </div>

    </div>

    <div id="login-modal" class="modal-backdrop">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 p-6 w-full max-w-sm mx-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2"><i class="ph ph-sign-in"></i> Ingresar</h2>
                <button id="login-close" class="p-1 rounded text-slate-400 hover:bg-slate-100" aria-label="Cerrar"><i class="ph ph-x text-xl"></i></button>
            </div>
            <form id="login-form" class="flex flex-col gap-3">
                <label class="text-xs font-semibold text-slate-600">Usuario
                    <input type="text" id="login-user" autocomplete="username" required class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500" />
                </label>
                <label class="text-xs font-semibold text-slate-600">Contraseña
                    <input type="password" id="login-pass" autocomplete="current-password" required class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500" />
                </label>
                <div id="login-error" class="text-xs text-red-600 hidden"></div>
                <button type="submit" id="login-submit" class="mt-2 px-4 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm transition-all">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const CURSOS = ['1A', '1B', '1C', '2A', '2B', '2C', '3A', '3B', '4A', '4B'];
        let activeCurso = localStorage.getItem('activeCurso') || '1A';
        if (!CURSOS.includes(activeCurso)) activeCurso = '1A';

        // albums[curso] = { size, slots: [{name, rut, hasPhoto, contentType, _v}] }
        const albums = {};
        CURSOS.forEach(c => { albums[c] = null; });

        const courseSelector = document.getElementById('course-selector');
        const gridContainer = document.getElementById('grid-container');
        const gridLoading = document.getElementById('grid-loading');
        const excelInput = document.getElementById('excel-input');
        const btnExcel = document.getElementById('btn-excel');
        const excelCursoLabel = document.getElementById('excel-curso-label');
        const sizeLabel = document.getElementById('size-label');
        const sizeCursoLabel = document.getElementById('size-curso-label');
        const btnDownload = document.getElementById('btn-download');
        const downloadText = document.getElementById('download-text');
        const downloadIcon = document.getElementById('download-icon');
        const loadingIcon = document.getElementById('loading-icon');
        const btnAddCell = document.getElementById('btn-add-cell');
        const btnRemoveCell = document.getElementById('btn-remove-cell');
        const toastEl = document.getElementById('toast');
        const headerSubtitle = document.getElementById('header-subtitle');
        const authStatus = document.getElementById('auth-status');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const loginModal = document.getElementById('login-modal');
        const loginForm = document.getElementById('login-form');
        const loginUser = document.getElementById('login-user');
        const loginPass = document.getElementById('login-pass');
        const loginError = document.getElementById('login-error');
        const loginClose = document.getElementById('login-close');
        const adminOnlyEls = () => document.querySelectorAll('.admin-only');

        let currentUser = null;
        const isAdmin = () => !!currentUser;

        let toastTimer = null;
        function toast(msg, kind = '') {
            toastEl.textContent = msg;
            toastEl.className = `toast show ${kind}`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toastEl.className = `toast ${kind}`; }, 2500);
        }

        function formatName(filename) {
            if (!filename) return '';
            const noExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
            return noExt.replace(/[-_]/g, ' ').split(' ')
                .filter(Boolean)
                .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
                .join(' ');
        }

        const photoUrl = (curso, position, v) =>
            `/api/photo?curso=${encodeURIComponent(curso)}&position=${position}&v=${v || 0}`;

        // Tamaño objetivo de cada foto (carnet vertical 4:3 estándar del cuadro de honor)
        const TARGET_W = 5568;
        const TARGET_H = 4176;
        const MAX_BYTES = 5 * 1024 * 1024; // 5MB para quedar bajo el límite de 6MB de Netlify

        function loadImageFromFile(file) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('Formato no soportado por el navegador (probá JPG o PNG)'));
                };
                img.src = url;
            });
        }

        async function prepareImage(file) {
            // Acepta cualquier formato que el navegador pueda decodificar (JPG, PNG, WEBP, GIF, BMP, etc.)
            const img = await loadImageFromFile(file);

            const canvas = document.createElement('canvas');
            canvas.width = TARGET_W;
            canvas.height = TARGET_H;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, TARGET_W, TARGET_H);

            // Crop centrado tipo object-cover: rellena 5568x4176 sin deformar
            const srcRatio = img.width / img.height;
            const dstRatio = TARGET_W / TARGET_H;
            let sx, sy, sw, sh;
            if (srcRatio > dstRatio) {
                // imagen más ancha → recorta lados
                sh = img.height;
                sw = sh * dstRatio;
                sx = (img.width - sw) / 2;
                sy = 0;
            } else {
                // imagen más alta → recorta arriba/abajo
                sw = img.width;
                sh = sw / dstRatio;
                sx = 0;
                sy = (img.height - sh) / 2;
            }
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, TARGET_W, TARGET_H);

            // Exportar a JPEG, ajustando calidad si pesa demasiado
            const qualities = [0.88, 0.82, 0.75, 0.68, 0.6];
            for (const q of qualities) {
                const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', q));
                if (!blob) throw new Error('No se pudo generar la imagen');
                if (blob.size <= MAX_BYTES) return blob;
            }
            // Última pasada con calidad mínima decente
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.55));
            return blob;
        }

        async function api(path, opts = {}) {
            const res = await fetch(path, opts);
            if (res.status === 401) {
                if (currentUser !== null) {
                    currentUser = null;
                    applyAuthUI();
                    toast('Sesión expirada, ingresa nuevamente', 'error');
                }
                throw new Error('No autorizado');
            }
            if (!res.ok) {
                let detail = '';
                try { detail = (await res.json()).error || ''; } catch {}
                throw new Error(detail || `HTTP ${res.status}`);
            }
            const ct = res.headers.get('content-type') || '';
            if (ct.includes('application/json')) return res.json();
            return res;
        }

        async function fetchMe() {
            try {
                const r = await fetch('/api/me');
                if (!r.ok) return null;
                const data = await r.json();
                return data.user || null;
            } catch { return null; }
        }

        function applyAuthUI() {
            if (isAdmin()) {
                adminOnlyEls().forEach(el => el.classList.remove('hidden-visitor'));
                btnLogin.classList.add('hidden');
                btnLogout.classList.remove('hidden');
                authStatus.textContent = `Sesión: ${currentUser}`;
                headerSubtitle.textContent = 'Selecciona un curso y arrastra las fotos. Todo se guarda automáticamente.';
            } else {
                adminOnlyEls().forEach(el => el.classList.add('hidden-visitor'));
                btnLogin.classList.remove('hidden');
                btnLogout.classList.add('hidden');
                authStatus.textContent = 'Modo visualización';
                headerSubtitle.textContent = 'Selecciona un curso para ver el cuadro de honor.';
            }
            // Re-render grid with new permissions
            if (albums[activeCurso]) renderGrid();
        }

        function openLoginModal() {
            loginError.classList.add('hidden');
            loginError.textContent = '';
            loginUser.value = '';
            loginPass.value = '';
            loginModal.classList.add('show');
            setTimeout(() => loginUser.focus(), 50);
        }
        function closeLoginModal() {
            loginModal.classList.remove('show');
        }

        async function doLogin(user, password) {
            loginError.classList.add('hidden');
            try {
                const r = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ user, password })
                });
                if (r.status === 401) {
                    loginError.textContent = 'Usuario o contraseña incorrectos';
                    loginError.classList.remove('hidden');
                    return false;
                }
                if (!r.ok) {
                    loginError.textContent = `Error: HTTP ${r.status}`;
                    loginError.classList.remove('hidden');
                    return false;
                }
                const data = await r.json();
                currentUser = data.user;
                applyAuthUI();
                closeLoginModal();
                toast(`Bienvenido, ${currentUser}`);
                return true;
            } catch (e) {
                loginError.textContent = e.message || 'Error de red';
                loginError.classList.remove('hidden');
                return false;
            }
        }

        async function doLogout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } catch {}
            currentUser = null;
            applyAuthUI();
            toast('Sesión cerrada');
        }

        btnLogin.addEventListener('click', openLoginModal);
        btnLogout.addEventListener('click', doLogout);
        loginClose.addEventListener('click', closeLoginModal);
        loginModal.addEventListener('click', (e) => { if (e.target === loginModal) closeLoginModal(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && loginModal.classList.contains('show')) closeLoginModal();
        });
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submit = document.getElementById('login-submit');
            submit.disabled = true;
            submit.textContent = 'Ingresando…';
            await doLogin(loginUser.value, loginPass.value);
            submit.disabled = false;
            submit.textContent = 'Entrar';
        });

        async function loadAlbum(curso) {
            const data = await api(`/api/album?curso=${encodeURIComponent(curso)}`);
            data.slots = data.slots.map(s => ({ ...s, _v: Date.now() }));
            albums[curso] = data;
            return data;
        }

        function renderCourseButtons() {
            courseSelector.innerHTML = '';
            CURSOS.forEach(curso => {
                const btn = document.createElement('button');
                btn.innerText = curso;
                btn.className = `px-4 py-2 rounded-lg font-semibold transition-all ${
                    activeCurso === curso
                        ? 'bg-blue-600 text-white shadow-md'
                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }`;
                btn.onclick = async () => {
                    if (curso === activeCurso) return;
                    activeCurso = curso;
                    localStorage.setItem('activeCurso', curso);
                    excelCursoLabel.innerText = curso;
                    sizeCursoLabel.innerText = curso;
                    downloadText.innerText = `Descargar Cuadro Completo (${curso})`;
                    renderCourseButtons();
                    await ensureLoaded(curso);
                    renderGrid();
                };
                courseSelector.appendChild(btn);
            });
        }

        async function ensureLoaded(curso) {
            if (albums[curso]) return;
            gridLoading.classList.remove('hidden');
            try {
                await loadAlbum(curso);
            } catch (e) {
                toast(`Error cargando: ${e.message}`, 'error');
                albums[curso] = { size: 49, slots: Array.from({ length: 49 }, () => ({ name: '', rut: '', hasPhoto: false, _v: 0 })) };
            } finally {
                gridLoading.classList.add('hidden');
            }
        }

        function renderGrid() {
            const album = albums[activeCurso];
            if (!album) return;
            sizeLabel.innerText = album.size;
            btnRemoveCell.classList.toggle('hidden', album.size <= 49);

            gridContainer.innerHTML = '';
            for (let i = 0; i < album.size; i++) {
                const cell = buildCell(i);
                gridContainer.appendChild(cell);
            }
        }

        function buildCell(index) {
            const cell = document.createElement('div');
            cell.dataset.index = index;
            cell.className = 'cell-wrapper relative flex flex-col group rounded-lg overflow-hidden border-2 transition-all bg-white';

            if (isAdmin()) {
                cell.addEventListener('dragover', (e) => handleDragOver(e, cell));
                cell.addEventListener('dragleave', (e) => handleDragLeave(e, cell));
                cell.addEventListener('drop', (e) => handleDrop(e, index, cell));

                cell.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-btn') || e.target.closest('.info-area')) return;
                    if (cell.classList.contains('cell-busy')) return;
                    const data = albums[activeCurso].slots[index];
                    if (!data.hasPhoto) {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'image/*';
                        input.onchange = (eFile) => {
                            const f = eFile.target.files[0];
                            if (f) uploadPhoto(index, f, cell);
                        };
                        input.click();
                    }
                });
            }

            paintCell(cell, index);
            return cell;
        }

        function paintCell(cell, index) {
            const album = albums[activeCurso];
            const data = album.slots[index];
            const hasImage = !!data.hasPhoto;
            const admin = isAdmin();
            const displayName = data.name || (admin ? `Alumno ${index + 1}` : '—');
            const displayRut = data.rut || '';

            cell.className = `cell-wrapper relative flex flex-col group rounded-lg overflow-hidden border-2 transition-all bg-white ${
                hasImage ? 'border-slate-200 hover:shadow-md' : (admin ? 'border-dashed border-slate-300 bg-slate-50 hover:bg-slate-100 cursor-pointer' : 'border-slate-200 bg-slate-50')
            }`;

            const positionBadge = `
                <div class="absolute top-1.5 left-1.5 z-10 bg-blue-600 text-white text-[10px] font-bold rounded px-1.5 py-0.5 shadow">
                    ${index + 1}
                </div>
            `;

            const deleteBtn = (admin && hasImage)
                ? `<button class="delete-btn absolute top-1.5 right-1.5 p-1 bg-red-500/85 text-white rounded-md opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-600" title="Quitar foto"><i class="ph ph-trash text-sm"></i></button>`
                : '';

            const photoArea = hasImage
                ? `
                    <div class="relative w-full aspect-[3/4] overflow-hidden bg-slate-100">
                        ${positionBadge}
                        <img src="${photoUrl(activeCurso, index, data._v)}" alt="${escapeHtml(displayName)}" class="w-full h-full object-cover" />
                        ${deleteBtn}
                    </div>
                `
                : `
                    <div class="relative w-full aspect-[3/4] overflow-hidden bg-slate-100 flex flex-col items-center justify-center p-3">
                        ${positionBadge}
                        ${admin
                            ? `<i class="ph ph-camera text-3xl mb-1 text-slate-400 drop-icon"></i>
                               <span class="text-[10px] text-center font-medium text-slate-400 drop-text">Arrastra o haz clic</span>`
                            : `<i class="ph ph-user text-3xl text-slate-300"></i>
                               <span class="text-[10px] text-slate-300 mt-1">Sin foto</span>`
                        }
                    </div>
                `;

            const infoArea = `
                <div class="info-area px-1.5 py-1.5 border-t border-slate-200 bg-white text-center ${admin ? 'cursor-text' : ''}" ${admin ? 'title="Clic para editar nombre y RUT"' : ''}>
                    <div class="name-text text-[10px] sm:text-[11px] font-semibold text-slate-700 leading-tight">
                        ${escapeHtml(displayName)}
                    </div>
                    ${displayRut ? `<div class="text-[9px] sm:text-[10px] text-slate-500 mt-0.5 leading-tight">${escapeHtml(displayRut)}</div>` : (admin ? `<div class="text-[9px] text-slate-300 mt-0.5">Sin RUT</div>` : '')}
                </div>
            `;

            cell.innerHTML = photoArea + infoArea;

            if (admin && hasImage) {
                cell.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    removePhoto(index, cell);
                });
            }
            if (admin) {
                cell.querySelector('.info-area').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (cell.classList.contains('cell-busy')) return;
                    editInfo(cell, index);
                });
            }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function handleDragOver(e, cell) {
            e.preventDefault(); e.stopPropagation();
            cell.classList.add('border-blue-500', 'bg-blue-50', 'scale-[1.02]', 'shadow-lg', 'z-10');
            const dt = cell.querySelector('.drop-text');
            const di = cell.querySelector('.drop-icon');
            if (dt) dt.innerText = '¡Suelta la foto!';
            if (di) di.className = 'ph ph-upload-simple text-3xl mb-1 text-blue-500 animate-bounce drop-icon';
        }

        function handleDragLeave(e, cell) {
            e.preventDefault(); e.stopPropagation();
            paintCell(cell, parseInt(cell.dataset.index));
        }

        function handleDrop(e, index, cell) {
            e.preventDefault(); e.stopPropagation();
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                uploadPhoto(index, files[0], cell);
            } else {
                paintCell(cell, index);
            }
        }

        async function uploadPhoto(index, file, cell) {
            const album = albums[activeCurso];
            const existingName = album.slots[index]?.name || '';
            const fallbackName = existingName.trim() ? existingName : formatName(file.name);

            cell.classList.add('cell-busy');
            try {
                // Procesar la imagen: ajustar a 5568x4176 (crop centrado) y comprimir a JPEG
                let processedBlob;
                try {
                    processedBlob = await prepareImage(file);
                } catch (prepErr) {
                    throw new Error(prepErr.message || 'No se pudo procesar la imagen');
                }

                const processedFile = new File([processedBlob], 'photo.jpg', { type: 'image/jpeg' });
                const form = new FormData();
                form.append('curso', activeCurso);
                form.append('position', String(index));
                form.append('file', processedFile);
                form.append('fallbackName', fallbackName);
                const result = await api('/api/photo', { method: 'POST', body: form });
                album.slots[index] = { ...result.slot, _v: Date.now() };
                if (result.size && result.size > album.size) album.size = result.size;
            } catch (e) {
                toast(`Error subiendo: ${e.message}`, 'error');
            } finally {
                cell.classList.remove('cell-busy');
                paintCell(cell, index);
            }
        }

        async function removePhoto(index, cell) {
            cell.classList.add('cell-busy');
            try {
                await api(`/api/photo?curso=${encodeURIComponent(activeCurso)}&position=${index}`, { method: 'DELETE' });
                albums[activeCurso].slots[index].hasPhoto = false;
                albums[activeCurso].slots[index].contentType = null;
            } catch (e) {
                toast(`Error: ${e.message}`, 'error');
            } finally {
                cell.classList.remove('cell-busy');
                paintCell(cell, index);
            }
        }

        function editInfo(cell, index) {
            const album = albums[activeCurso];
            const data = album.slots[index];
            const infoArea = cell.querySelector('.info-area');
            infoArea.innerHTML = `
                <div class="flex flex-col gap-1 px-0.5">
                    <input class="edit-name w-full text-[11px] text-center border-b border-blue-500 focus:outline-none bg-transparent font-semibold" placeholder="Nombre completo" value="${escapeHtml(data.name || '')}">
                    <input class="edit-rut w-full text-[10px] text-center border-b border-blue-500 focus:outline-none bg-transparent text-slate-600" placeholder="RUT" value="${escapeHtml(data.rut || '')}">
                </div>
            `;
            const inputName = infoArea.querySelector('.edit-name');
            const inputRut = infoArea.querySelector('.edit-rut');
            inputName.focus();
            inputName.selectionStart = inputName.selectionEnd = inputName.value.length;

            let saved = false;
            const save = async () => {
                if (saved) return;
                saved = true;
                const name = inputName.value;
                const rut = inputRut.value;
                if (name === (data.name || '') && rut === (data.rut || '')) {
                    paintCell(cell, index);
                    return;
                }
                cell.classList.add('cell-busy');
                try {
                    const result = await api('/api/info', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ curso: activeCurso, position: index, name, rut })
                    });
                    album.slots[index] = { ...album.slots[index], ...result.slot };
                } catch (e) {
                    toast(`Error guardando: ${e.message}`, 'error');
                } finally {
                    cell.classList.remove('cell-busy');
                    paintCell(cell, index);
                }
            };

            inputName.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); inputRut.focus(); }
                if (e.key === 'Escape') { saved = true; paintCell(cell, index); }
            });
            inputRut.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); save(); }
                if (e.key === 'Escape') { saved = true; paintCell(cell, index); }
            });
            infoArea.addEventListener('focusout', (e) => {
                if (!infoArea.contains(e.relatedTarget)) save();
            });
        }

        btnExcel.addEventListener('click', () => excelInput.click());

        excelInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (typeof window.XLSX === 'undefined') {
                toast('Excel aún cargando, intenta de nuevo', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const workbook = window.XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1 });

                    const students = [];
                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length === 0) continue;
                        const valRut = String(row[1] || '').trim();
                        const valNombre = String(row[2] || '').trim();
                        if (valNombre || valRut) students.push({ name: valNombre, rut: valRut });
                    }

                    if (students.length === 0) {
                        toast('No se encontraron datos en el Excel', 'error');
                        return;
                    }

                    const album = albums[activeCurso];
                    const targetSize = Math.max(album.size, students.length);

                    const slots = students.map((s, i) => ({ position: i, name: s.name, rut: s.rut }));
                    gridLoading.classList.remove('hidden');
                    const result = await api('/api/bulk-info', {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify({ curso: activeCurso, slots })
                    });
                    if (result.slots) {
                        album.size = result.size;
                        album.slots = result.slots.map((s, i) => ({
                            ...s,
                            _v: album.slots[i]?._v || Date.now()
                        }));
                    }
                    renderGrid();
                    toast(`✓ ${students.length} alumnos cargados en ${activeCurso}`);
                } catch (err) {
                    console.error(err);
                    toast(`Error Excel: ${err.message}`, 'error');
                } finally {
                    gridLoading.classList.add('hidden');
                    excelInput.value = '';
                }
            };
            reader.readAsBinaryString(file);
        });

        btnAddCell.addEventListener('click', async () => {
            try {
                const result = await api('/api/expand', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ curso: activeCurso })
                });
                const album = albums[activeCurso];
                album.size = result.size;
                while (album.slots.length < album.size) {
                    album.slots.push({ name: '', rut: '', hasPhoto: false, _v: 0 });
                }
                renderGrid();
                toast(`Cuadro ${album.size} agregado`);
            } catch (e) {
                toast(`Error: ${e.message}`, 'error');
            }
        });

        btnRemoveCell.addEventListener('click', async () => {
            const album = albums[activeCurso];
            if (album.size <= 49) return;
            const last = album.slots[album.size - 1];
            if (last.hasPhoto || last.name || last.rut) {
                if (!confirm(`¿Quitar el último cuadro (${album.size})? Se borrará su foto y datos.`)) return;
            }
            try {
                const result = await api('/api/shrink', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ curso: activeCurso })
                });
                album.size = result.size;
                album.slots = album.slots.slice(0, album.size);
                renderGrid();
                toast(`Cuadro quitado, ahora ${album.size}`);
            } catch (e) {
                toast(`Error: ${e.message}`, 'error');
            }
        });

        btnDownload.addEventListener('click', async () => {
            btnDownload.disabled = true;
            btnDownload.classList.replace('bg-blue-600', 'bg-blue-400');
            btnDownload.classList.remove('hover:-translate-y-1', 'hover:shadow-xl');
            downloadIcon.classList.add('hidden');
            loadingIcon.classList.remove('hidden');
            downloadText.innerText = 'Procesando…';

            try {
                const album = albums[activeCurso];
                const cols = 7;
                const rows = Math.ceil(album.size / cols);
                const cellW = 500;
                const imgH = 550;
                const infoH = 130;
                const cellH = imgH + infoH;
                const gap = 25;
                const margin = 80;
                const headerH = 150;

                const canvas = document.createElement('canvas');
                canvas.width = (cols * cellW) + ((cols - 1) * gap) + (margin * 2);
                canvas.height = (rows * cellH) + ((rows - 1) * gap) + (margin * 2) + headerH;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 80px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`Cuadro de Honor - Curso ${activeCurso}`, canvas.width / 2, margin + 80);

                const loadImage = (url) => new Promise((resolve, reject) => {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = url;
                });

                const wrapText = (text, maxWidth) => {
                    const words = String(text).split(/\s+/).filter(Boolean);
                    const lines = [];
                    let current = '';
                    for (const w of words) {
                        const test = current ? current + ' ' + w : w;
                        if (ctx.measureText(test).width > maxWidth && current) {
                            lines.push(current);
                            current = w;
                        } else {
                            current = test;
                        }
                    }
                    if (current) lines.push(current);
                    return lines;
                };

                for (let i = 0; i < album.size; i++) {
                    const slot = album.slots[i];
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    const x = margin + (col * (cellW + gap));
                    const y = margin + headerH + (row * (cellH + gap));

                    if (slot && slot.hasPhoto) {
                        try {
                            const img = await loadImage(photoUrl(activeCurso, i, slot._v));
                            const imgRatio = img.width / img.height;
                            const boxRatio = cellW / imgH;
                            let sw, sh, sx, sy;
                            if (imgRatio > boxRatio) {
                                sh = img.height; sw = sh * boxRatio;
                                sx = (img.width - sw) / 2; sy = 0;
                            } else {
                                sw = img.width; sh = sw / boxRatio;
                                sx = 0; sy = (img.height - sh) / 2;
                            }
                            ctx.drawImage(img, sx, sy, sw, sh, x, y, cellW, imgH);
                        } catch (err) {
                            console.error('img', i, err);
                            ctx.fillStyle = '#fee2e2';
                            ctx.fillRect(x, y, cellW, imgH);
                        }
                    } else {
                        ctx.fillStyle = '#f8fafc';
                        ctx.fillRect(x, y, cellW, imgH);
                        ctx.strokeStyle = '#cbd5e1';
                        ctx.setLineDash([15, 15]);
                        ctx.lineWidth = 4;
                        ctx.strokeRect(x, y, cellW, imgH);
                        ctx.setLineDash([]);
                    }

                    ctx.strokeStyle = '#e2e8f0';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, cellW, imgH);

                    ctx.fillStyle = '#2563eb';
                    ctx.fillRect(x + 12, y + 12, 80, 50);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 32px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(String(i + 1), x + 52, y + 48);

                    ctx.fillStyle = '#334155';
                    ctx.font = 'bold 30px sans-serif';
                    ctx.textAlign = 'center';
                    const name = slot?.name || `Alumno ${i + 1}`;
                    const lines = wrapText(name, cellW - 30);
                    const maxLines = 2;
                    const used = lines.slice(0, maxLines);
                    if (lines.length > maxLines) {
                        used[maxLines - 1] = used[maxLines - 1] + '…';
                    }
                    used.forEach((ln, k) => {
                        ctx.fillText(ln, x + (cellW / 2), y + imgH + 40 + (k * 36));
                    });

                    if (slot?.rut) {
                        ctx.fillStyle = '#64748b';
                        ctx.font = '24px sans-serif';
                        ctx.fillText(slot.rut, x + (cellW / 2), y + imgH + 40 + (used.length * 36) + 8);
                    }
                }

                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                const link = document.createElement('a');
                link.download = `Cuadro_Honor_Curso_${activeCurso}.jpg`;
                link.href = dataUrl;
                link.click();
            } catch (e) {
                console.error(e);
                toast(`Error al generar imagen: ${e.message}`, 'error');
            } finally {
                btnDownload.disabled = false;
                btnDownload.classList.replace('bg-blue-400', 'bg-blue-600');
                btnDownload.classList.add('hover:-translate-y-1', 'hover:shadow-xl');
                downloadIcon.classList.remove('hidden');
                loadingIcon.classList.add('hidden');
                downloadText.innerText = `Descargar Cuadro Completo (${activeCurso})`;
            }
        });

        async function init() {
            excelCursoLabel.innerText = activeCurso;
            sizeCursoLabel.innerText = activeCurso;
            downloadText.innerText = `Descargar Cuadro Completo (${activeCurso})`;
            currentUser = await fetchMe();
            applyAuthUI();
            renderCourseButtons();
            await ensureLoaded(activeCurso);
            renderGrid();
        }

        init();
    </script>
</body>
</html>
